name: Windows build

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-sqlite3
      - name: Build application and tests
        shell: msys2 {0}
        run: |
          # MSYS2's location on GitHub runners need not be C:\msys64.
          UCRT_ROOT="$(cygpath -w /ucrt64)"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File build_windows.ps1 -Target All -Ucrt64 "$UCRT_ROOT"
      - name: Run non-interactive tests
        shell: msys2 {0}
        run: |
          ./EduTrackTests.exe
          ./EduTrackValidationTests.exe
          ./EduTrackSqliteTests.exe
          ./EduTrackWorkflowTests.exe
          ./EduTrackMaintenanceTests.exe
      - name: Package clean source and test materials
        uses: actions/upload-artifact@v4
        with:
          name: EduTrack-source-${{ github.sha }}
          path: |
            .github/workflows/build.yml
            .gitignore
            README.md
            build_windows.ps1
            run_windows.ps1
            database/
            docs/
            gui/
            include/
            src/
            tests/
            tools/
          include-hidden-files: true
          retention-days: 30
          compression-level: 9
