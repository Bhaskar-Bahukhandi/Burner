name: Windows build

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-sqlite3
      - name: Check PowerShell script syntax
        shell: pwsh
        run: |
          foreach ($script in @('build_windows.ps1', 'run_windows.ps1', 'package_windows.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              throw ($parseErrors | Out-String)
            }
          }
      - name: Build application and tests
        shell: msys2 {0}
        run: |
          # MSYS2's location on GitHub runners need not be C:\msys64.
          UCRT_ROOT="$(cygpath -w /ucrt64)"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File build_windows.ps1 -Target All -Ucrt64 "$UCRT_ROOT"
      - name: Run non-interactive tests
        shell: msys2 {0}
        run: |
          ./EduTrackTests.exe
          ./EduTrackValidationTests.exe
          ./EduTrackSqliteTests.exe
          ./EduTrackWorkflowTests.exe
          ./EduTrackMaintenanceTests.exe
      - name: Package Windows app with runtime DLLs
        shell: msys2 {0}
        run: |
          UCRT_ROOT="$(cygpath -w /ucrt64)"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File package_windows.ps1 -Ucrt64 "$UCRT_ROOT"
          test -f dist/EduTrack/EduTrack.exe
          test -f dist/EduTrack/libsqlite3-0.dll
      - name: Upload portable Windows application
        uses: actions/upload-artifact@v4
        with:
          name: EduTrack-Windows-portable
          path: dist/EduTrack/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
      - name: Package clean source and test materials
        uses: actions/upload-artifact@v4
        with:
          name: EduTrack-source-${{ github.sha }}
          path: |
            .github/workflows/build.yml
            .gitignore
            README.md
            build_windows.ps1
            package_windows.ps1
            run_windows.ps1
            database/
            docs/
            gui/
            include/
            src/
            tests/
            tools/
          include-hidden-files: true
          retention-days: 30
          compression-level: 9
